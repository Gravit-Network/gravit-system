name: CI - Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pytest pytest-cov
          for req in services/*/requirements.txt; do
            if [ -f "$req" ]; then
              pip install -r $req
            fi
          done

      - name: Lint with flake8
        run: |
          flake8 services/ --count --max-complexity=15 --statistics --show-source

      - name: Check formatting with black
        run: |
          black --check services/ --line-length 100

      - name: Type check with mypy
        run: |
          mypy services/ --ignore-missing-imports --allow-untyped-decorators

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=services --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker-compose -f infra/docker-compose.yml build --parallel

      - name: Start services
        run: |
          docker-compose -f infra/docker-compose.yml up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "Services are healthy"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "Services failed to start"
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: |
          docker-compose -f infra/docker-compose.yml logs --tail=100

      - name: Stop services
        if: always()
        run: |
          docker-compose -f infra/docker-compose.yml down

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Notify on Status
    runs-on: ubuntu-latest
    needs: [test-python, test-docker-build, security-scan]
    if: always()

    steps:
      - name: Check status
        run: |
          echo "CI completed with status: ${{ needs.test-python.result }}"

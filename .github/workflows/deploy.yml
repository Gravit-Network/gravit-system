name: CD - Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=git-
            type=raw,value=latest

      - name: Build and push images
        run: |
          for service in api generator validator consensus history eql; do
            docker build \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-$service:${{ steps.meta.outputs.version }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-$service:latest \
              --file infra/docker/Dockerfile.$service \
              .
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-$service:${{ steps.meta.outputs.version }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-$service:latest
          done

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'staging' || github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.gravitnetwork.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/gravit-system
            git pull origin main
            docker-compose -f infra/docker-compose.yml down
            docker-compose -f infra/docker-compose.yml pull
            docker-compose -f infra/docker-compose.yml up -d
            docker system prune -f

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://gravitnetwork.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/gravit-system
            git pull origin main
            docker-compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml down
            docker-compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml pull
            docker-compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
            docker system prune -f

      - name: Health check
        run: |
          sleep 30
          curl --retry 10 --retry-delay 5 --fail https://gravitnetwork.org/health

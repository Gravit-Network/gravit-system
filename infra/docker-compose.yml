version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - GENERATOR_URL=http://generator:8001
      - VALIDATOR_URL=http://validator:8002
      - CONSENSUS_URL=http://consensus:8003
      - HISTORY_URL=http://history:8004
      - EQL_URL=http://eql:8005
    depends_on:
      - generator
      - validator
      - consensus
      - history
      - eql
    networks:
      - gravit-network

  generator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.generator
    ports:
      - "8001:8001"
    environment:
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - gravit-network

  validator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.validator
    ports:
      - "8002:8002"
    depends_on:
      - consensus
    networks:
      - gravit-network

  consensus:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.consensus
    ports:
      - "8003:8003"
    networks:
      - gravit-network

  history:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.history
    ports:
      - "8004:8004"
    volumes:
      - history_data:/data
    networks:
      - gravit-network

  eql:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.eql
    ports:
      - "8005:8005"
    depends_on:
      - history
    networks:
      - gravit-network

  ui:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ui
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - gravit-network

networks:
  gravit-network:
    driver: bridge

volumes:
  history_data:
